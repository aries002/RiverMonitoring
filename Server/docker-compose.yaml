services:
  database:
    image: mariadb:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: water_level
      MYSQL_USER: app
      MYSQL_PASSWORD: password
    volumes:
      - ./data/mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # ports:
    #   - "3306:3306"
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: always
    depends_on:
      - database
    environment:
      PMA_HOST: database
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "8080:80"
  redis:
    image: redis:latest
    restart: always
    # ports:
    #   - "6379:6379"
    volumes:
      - ./data/redis_data:/root/redis
      # - ./data/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      # - REDIS_PASSWORD=my-password
      - REDIS_PORT=6379
      # - REDIS_DATABASES=16

  video_server:
    build:
      context: ./
    ports:
      -8000:8000/udp
    depends_on:
      - database
      - redis
  # dashboard: